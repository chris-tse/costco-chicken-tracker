name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Typecheck, Lint, Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chicken_tracking_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d chicken_tracking_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bunx vitest run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chicken_tracking_test

  container-smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chrome for Testing
        id: container-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Verify self-hosted container
        env:
          ACCEPTANCE_BROWSER_LABEL: Google Chrome container smoke (${{ steps.container-chrome.outputs.chrome-version }})
          BROWSER_EXECUTABLE_PATH: ${{ steps.container-chrome.outputs.chrome-path }}
        run: bun run container:smoke

  supported-chrome:
    name: Current and previous Chrome acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install current Chrome for Testing
        id: current-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Verify current Chrome
        env:
          ACCEPTANCE_BROWSER_LABEL: Google Chrome current (${{ steps.current-chrome.outputs.chrome-version }})
          BROWSER_EXECUTABLE_PATH: ${{ steps.current-chrome.outputs.chrome-path }}
        run: |
          mkdir --parents acceptance-artifacts
          bun run acceptance:container 2>&1 | tee acceptance-artifacts/current-chrome.log

      - name: Resolve immediately previous Chrome major
        id: previous-chrome
        env:
          CURRENT_CHROME_PATH: ${{ steps.current-chrome.outputs.chrome-path }}
        run: |
          current_version="$($CURRENT_CHROME_PATH --product-version)"
          current_major="${current_version%%.*}"
          previous_major=$((current_major - 1))
          echo "major=$previous_major" >> "$GITHUB_OUTPUT"

      - name: Install immediately previous Chrome for Testing
        id: previous-chrome-install
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ steps.previous-chrome.outputs.major }}

      - name: Verify immediately previous Chrome
        env:
          ACCEPTANCE_BROWSER_LABEL: Google Chrome previous (${{ steps.previous-chrome-install.outputs.chrome-version }})
          BROWSER_EXECUTABLE_PATH: ${{ steps.previous-chrome-install.outputs.chrome-path }}
        run: |
          mkdir --parents acceptance-artifacts
          bun run acceptance:container 2>&1 | tee acceptance-artifacts/previous-chrome.log

      - name: Upload Chrome acceptance artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-acceptance-${{ github.sha }}
          path: acceptance-artifacts/
          if-no-files-found: warn
